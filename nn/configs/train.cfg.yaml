train_config:
  learn_rate: !!float 1e-4
  epochs: &e 2000

  losses:
    - convergence
    - divergence
    # - eikonal
  
  lambdas:
    - [0.0, 1.0]
    - [0.0, 1.0]
    # - [0.0, !!float 1e-3]

  warmups:
    - [0, 0]
    - [1000, *e]
    # - [1500, *e]

  losses_kwargs:
    conv_sigma: 0.01  # smallest
    div_sigma: 0.1  # largest
    eik_sigma: 0.05  # inbetween
    barrier: 1.0  # keep close to sink
    sink: -1.0  # keep close to barrier